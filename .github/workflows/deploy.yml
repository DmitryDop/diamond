name: Manual test deploy to SpaceWeb

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diamond-spaceweb-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install lftp and trusted CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lftp ca-certificates

      - name: Upload website over explicit FTPS
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          LFTP_PASSWORD: ${{ secrets.PALKAHELPRU_DIAMOND }}
        run: |
          set +x
          set -euo pipefail

          if [[ -z "$FTP_SERVER" || -z "$LFTP_PASSWORD" ]]; then
            echo '::error::Set the FTP_SERVER and PALKAHELPRU_DIAMOND repository secrets.'
            exit 1
          fi

          # Accept a hostname or IPv4 address only, without a scheme, path or port.
          if [[ ! "$FTP_SERVER" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo '::error::FTP_SERVER must contain only the FTP hostname or IPv4 address; port 21 is configured separately.'
            exit 1
          fi

          test -f index.html
          for directory in css js assets; do
            test -d "$directory"
          done

          # ftp:// with AUTH TLS on port 21 is explicit FTPS.
          # The password is read from the environment, never interpolated into commands.
          if lftp --norc <<LFTP
          set cmd:fail-exit yes
          set cmd:move-background no
          set net:timeout 30
          set net:max-retries 2
          set ftp:passive-mode yes
          set ftp:ssl-allow yes
          set ftp:ssl-auth TLS
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ftp:ssl-protect-list yes
          set ftp:ssl-use-ccc no
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          set ssl:use-sni yes
          set ssl:ca-file /etc/ssl/certs/ca-certificates.crt
          open --env-password --user palkahelru_diamond -p 21 "ftp://${FTP_SERVER}"
          cd public_html/
          put index.html -o index.html
          mirror --reverse --overwrite --no-perms --no-symlinks css/ css/
          mirror --reverse --overwrite --no-perms --no-symlinks js/ js/
          mirror --reverse --overwrite --no-perms --no-symlinks assets/ assets/
          bye
          LFTP
          then
            echo 'Website uploaded to public_html/.'
          else
            echo '::error::FTPS deployment failed. See the lftp error above. If the certificate does not match the IP or hostname, set FTP_SERVER to the SpaceWeb FTP DNS hostname listed in your hosting panel and covered by the certificate SAN. Ask SpaceWeb support for that hostname if needed. Certificate and hostname verification must remain enabled.'
            exit 1
          fi
