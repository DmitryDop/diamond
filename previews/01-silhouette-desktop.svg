<svg class="silhouette-svg silhouette-desktop" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" width="1440" height="1016" aria-hidden="true" focusable="false">
<style>svg { --silhouette-outline:#c4cbd2; --silhouette-secondary:#8c969f; --silhouette-datum:#58616b; --silhouette-label:#bec5cc; --body-font:Inter,Arial,sans-serif; background:#0e1013; }
use { stroke:var(--silhouette-outline); }
path, ellipse { stroke-width:1.25; vector-effect:non-scaling-stroke; }
.silhouette-contour { stroke:var(--silhouette-datum); }
.silhouette-secondary, .silhouette-cells { stroke:var(--silhouette-secondary); }
.silhouette-connectors { stroke:var(--silhouette-datum); }
.silhouette-leaders { stroke:var(--silhouette-secondary); stroke-linecap:round; stroke-linejoin:round; }
.silhouette-leaders circle { fill:var(--silhouette-label); stroke:none; }
.silhouette-labels { fill:var(--silhouette-label); font:400 16px Inter,Arial,sans-serif; letter-spacing:.01em; }</style>
